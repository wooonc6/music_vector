<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>코사인 유사도 음악 추천 모델</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 30px;
      color: #222;
    }
    .box {
      background: white;
      padding: 24px;
      border-radius: 16px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    h1 { color: #222; }
    .genre {
      display: grid;
      grid-template-columns: 120px 1fr 40px;
      gap: 12px;
      align-items: center;
      margin: 12px 0;
    }
    input[type="range"] { width: 100%; }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 24px;
      padding: 18px;
      background: #eef2ff;
      border-radius: 12px;
      line-height: 1.7;
    }
    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>음악 취향 벡터 추천 시스템</h1>

    <p>
      사용자의 음악 취향을 8차원 벡터로 표현하고,
      코사인 유사도를 이용해 가장 비슷한 취향의 사용자를 찾습니다.
    </p>

    <p>
      장르 순서:
      <b>K-pop, 힙합, 발라드, EDM, 인디, Rock, 재즈, OST</b>
    </p>

    <div id="inputs"></div>

    <button onclick="recommend()">추천 결과 보기</button>

    <div class="result" id="result">
      취향 점수를 입력한 뒤 버튼을 눌러보세요.
    </div>
  </div>

  <script>
    const genres = ["K-pop", "힙합", "발라드", "EDM", "인디", "Rock", "재즈", "OST"];

    const users = [
      {
        name: "User B",
        vector: [5, 4, 2, 2, 3, 1, 1, 4],
        songs: ["NewJeans - Ditto", "아이유 - 밤편지", "태연 - 그대라는 시"]
      },
      {
        name: "User C",
        vector: [1, 2, 1, 5, 2, 4, 1, 1],
        songs: ["Martin Garrix - Animals", "Imagine Dragons - Believer"]
      },
      {
        name: "User D",
        vector: [1, 1, 2, 1, 2, 2, 5, 1],
        songs: ["Miles Davis - So What", "Chet Baker - I Fall In Love Too Easily"]
      }
    ];

    const inputsDiv = document.getElementById("inputs");

    genres.forEach((genre, index) => {
      inputsDiv.innerHTML += `
        <div class="genre">
          <label>${genre}</label>
          <input type="range" min="0" max="5" value="3" id="g${index}"
                 oninput="document.getElementById('v${index}').innerText=this.value">
          <span id="v${index}">3</span>
        </div>
      `;
    });

    function dotProduct(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) {
        sum += a[i] * b[i];
      }
      return sum;
    }

    function magnitude(a) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) {
        sum += a[i] * a[i];
      }
      return Math.sqrt(sum);
    }

    function cosineSimilarity(a, b) {
      const dot = dotProduct(a, b);
      const magA = magnitude(a);
      const magB = magnitude(b);

      if (magA === 0 || magB === 0) return 0;

      return dot / (magA * magB);
    }

    function recommend() {
      const myVector = genres.map((_, i) => Number(document.getElementById(`g${i}`).value));

      let bestUser = null;
      let bestSimilarity = -1;

      users.forEach(user => {
        const sim = cosineSimilarity(myVector, user.vector);
        if (sim > bestSimilarity) {
          bestSimilarity = sim;
          bestUser = user;
        }
      });

      const dot = dotProduct(myVector, bestUser.vector);
      const magA = magnitude(myVector).toFixed(2);
      const magB = magnitude(bestUser.vector).toFixed(2);

      document.getElementById("result").innerHTML = `
        <b>나의 취향 벡터 a</b><br>
        a = (${myVector.join(", ")})<br><br>

        <b>가장 비슷한 사용자</b><br>
        ${bestUser.name}<br>
        b = (${bestUser.vector.join(", ")})<br><br>

        <b>계산 원리</b><br>
        a · b = ${dot}<br>
        |a| = ${magA}, |b| = ${magB}<br>
        cos θ = (a · b) / (|a| |b|)<br><br>

        <b>코사인 유사도</b><br>
        ${bestSimilarity.toFixed(4)}<br><br>

        <b>추천 노래</b><br>
        ${bestUser.songs.map(song => "• " + song).join("<br>")}
      `;
    }
  </script>
</body>
</html>
